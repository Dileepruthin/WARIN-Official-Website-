<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARIN LMS - All-in-One Learning Management System</title>
  <meta name="description" content="An elite, integrated edtech learning management system (LMS) combining course marketplaces, student progress tracking, live streams, fee collections, and parent updates.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic shell container initialized by app.js module -->
  <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; font-family: 'Plus Jakarta Sans', sans-serif; color: white;">
    <div style="border: 4px solid rgba(255,255,255,0.05); border-top-color: #6366f1; width: 44px; height: 44px; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
    <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.5px;">Loading LMS Core Environment...</div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script type="module" src="app.js"></script>
</body>
</html>
